name: MCP CI
on:
  push:
    branches: [main]
    paths: ["mcp_server/**", ".github/workflows/mcp-ci.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mcp_server}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile server.py
      - run: docker build -t simple-multi-llm-mcp:${{ github.sha }} .
